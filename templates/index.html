<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Spam Detection</title>
    <style>
        :root {
            --ink: #172235;
            --muted: #69758a;
            --line: #e8edf4;
            --blue: #3157d5;
            --blue-dark: #2446b8;
            --paper: #ffffff;
            --canvas: #f4f7fb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at 12% 18%, rgba(99, 102, 241, .38), transparent 25rem),
                radial-gradient(circle at 86% 16%, rgba(56, 189, 248, .28), transparent 24rem),
                radial-gradient(circle at 82% 86%, rgba(244, 114, 182, .24), transparent 22rem),
                radial-gradient(circle at 18% 84%, rgba(52, 211, 153, .22), transparent 20rem),
                linear-gradient(135deg, #eef2ff 0%, #ecfeff 48%, #fff1f2 100%);
            background-attachment: fixed;
        }

        body::before,
        body::after {
            position: fixed;
            z-index: -1;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            content: "";
            filter: blur(12px);
            opacity: .24;
            pointer-events: none;
        }

        body::before {
            top: -110px;
            left: -80px;
            background: linear-gradient(135deg, #8b5cf6, #3b82f6);
        }

        body::after {
            right: -90px;
            bottom: -120px;
            background: linear-gradient(135deg, #fb7185, #fbbf24);
        }

        .container {
            width: min(760px, calc(100% - 32px));
            margin: clamp(24px, 7vh, 72px) auto;
        }

        .panel {
            overflow: hidden;
            border: 1px solid rgba(220, 227, 238, .95);
            border-radius: 20px;
            background: rgba(255, 255, 255, .96);
            box-shadow: 0 22px 55px rgba(30, 43, 73, .10);
        }

        .panel-header {
            padding: 32px 36px 24px;
            border-bottom: 1px solid var(--line);
            background: linear-gradient(135deg, rgba(238, 242, 255, .92), rgba(236, 254, 255, .72) 55%, rgba(255, 241, 242, .78));
            border-top: 4px solid transparent;
            border-image: linear-gradient(90deg, #6366f1, #38bdf8, #34d399, #fb7185) 1;
        }

        .eyebrow {
            margin: 0 0 8px;
            color: var(--blue);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(28px, 5vw, 38px);
            line-height: 1.12;
            letter-spacing: -.04em;
        }

        .subtitle {
            max-width: 570px;
            margin: 12px 0 0;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.55;
        }

        form {
            padding: 28px 36px 32px;
        }

        label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
        }

        #counter {
            color: #9aa4b5;
            font-size: 12px;
            font-weight: 600;
        }

        textarea {
            width: 100%;
            min-height: 180px;
            padding: 16px 18px;
            border: 1px solid #dbe3ef;
            border-radius: 12px;
            outline: none;
            font: inherit;
            resize: vertical;
            line-height: 1.6;
            color: var(--ink);
            background: #fbfcfe;
            transition: border-color .2s, box-shadow .2s, background .2s;
        }

        textarea::placeholder {
            color: #a1aabd;
        }

        textarea:focus {
            border-color: rgba(49, 87, 213, .65);
            background: white;
            box-shadow: 0 0 0 4px rgba(49, 87, 213, .09);
        }

        .actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-top: 14px;
        }

        button {
            display: inline-flex;
            min-height: 46px;
            align-items: center;
            justify-content: center;
            gap: 9px;
            color: white;
            border: 0;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 750;
            background: var(--blue);
            padding: 12px 18px;
            box-shadow: 0 8px 18px rgba(49, 87, 213, .18);
            transition: transform .15s, background .15s, box-shadow .15s;
        }

        button:hover {
            transform: translateY(-1px);
            background: var(--blue-dark);
            box-shadow: 0 10px 22px rgba(49, 87, 213, .24);
        }

        button:active {
            transform: translateY(0);
        }

        .result {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 22px;
            padding: 16px 18px;
            border-radius: 12px;
            font-weight: 800;
        }

        .result-icon {
            display: grid;
            width: 34px;
            height: 34px;
            flex: 0 0 34px;
            place-items: center;
            border-radius: 50%;
        }

        .result-spam {
            background: #fee2e2;
            color: #b91c1c;
        }

        .result-spam .result-icon {
            background: #fecaca;
        }

        .result-not-spam {
            background: #dcfce7;
            color: #15803d;
        }

        .result-not-spam .result-icon {
            background: #bbf7d0;
        }

        .disclaimer {
            margin: 18px 0 0;
            color: #98a1b1;
            font-size: 12px;
            text-align: center;
        }

        @media (max-width: 600px) {
            .container {
                width: min(100% - 24px, 760px);
                margin: 24px auto;
            }

            .panel-header, form {
                padding-left: 22px;
                padding-right: 22px;
            }

            .actions {
                align-items: stretch;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <section class="panel">
            <header class="panel-header">
                <p class="eyebrow">Message scanner</p>
                <h1>Spam Detection</h1>
                <p class="subtitle">Paste an email or text message below. The scanner will analyze its content and classify it instantly.</p>
            </header>

            <form method="POST">
                <label for="message">
                    <strong>Message content</strong>
                    <span id="counter">0 characters</span>
                </label>
                <textarea id="message" name="message" maxlength="5000"
                    placeholder="Paste the message you want to analyze..." required>{{ message }}</textarea>

                <div class="actions">
                    <button type="submit">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke="currentColor" stroke-width="1.8"/>
                            <path d="M12 7v5l3 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        Analyze message
                    </button>
                </div>

                {% if prediction %}
                <div class="result {% if prediction == 'Spam' %}result-spam{% else %}result-not-spam{% endif %}" role="status">
                    <span class="result-icon" aria-hidden="true">
                        {% if prediction == 'Spam' %}
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                            <path d="M12 8v5M12 16.5v.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/>
                        </svg>
                        {% else %}
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                            <path d="M7 12l3 3 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/>
                        </svg>
                        {% endif %}
                    </span>
                    <span>{{ prediction }}</span>
                </div>
                {% endif %}
            </form>
        </section>
        <p class="disclaimer">Predictions are estimates and may not always be accurate.</p>
    </main>

    <script>
        const textarea = document.getElementById("message");
        const counter = document.getElementById("counter");

        function updateCounter() {
            const count = textarea.value.length;
            counter.textContent = count + (count === 1 ? " character" : " characters");
        }

        textarea.addEventListener("input", updateCounter);
        updateCounter();
    </script>
</body>
</html>
